name: Fix Secret docking iteration

on:
  push:
    branches: [Ai-temp]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Trigger Secret docking iteration fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('traitormod-voidtraitor-dev-ai/Lua/gamemodes/secret.lua')
          text = path.read_text(encoding='utf-8')
          old = '''    return mainSub.ConnectedDockingPorts.ContainsKey(endOutpost)
              or (mainSub.AtEndExit and charactersInsideOutpost > 0)
              or charactersInsideOutpost > charactersOutsideOutpost
'''
          new = '''    for dockedSub in mainSub.DockedTo do
              if dockedSub == endOutpost then return true end
          end

          return (mainSub.AtEndExit and charactersInsideOutpost > 0)
              or charactersInsideOutpost > charactersOutsideOutpost
'''
          assert text.count(old) == 1, 'expected docking block not found exactly once'
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- traitormod-voidtraitor-dev-ai/Lua/gamemodes/secret.lua
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'kotofey51'
          git config user.email '38777263+sashagavrilyuk@users.noreply.github.com'
          git add traitormod-voidtraitor-dev-ai/Lua/gamemodes/secret.lua
          git commit -m 'Fix Secret docking collection access'
          git push
