name: Fix Secret mission access and roundinfo

on:
  push:
    branches: [Ai-temp]
    paths:
      - .github/workflows/fix-secret-mission-roundinfo.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Ai-temp
      - name: Apply verified Secret fix
        shell: bash
        run: |
          set -euo pipefail
          FILE='traitormod-voidtraitor-dev-ai/Lua/gamemodes/secret.lua'
          test "$(git hash-object "$FILE")" = 'e7beb1e05c33f1e5d906e5163217dbd800e36528'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('traitormod-voidtraitor-dev-ai/Lua/gamemodes/secret.lua')
          s = p.read_text()
          s = s.replace('local missionDescriptor = Descriptors["Barotrauma.Mission"] or LuaUserData.RegisterType("Barotrauma.Mission")\n', '')
          s = s.replace('LuaUserData.MakeMethodAccessible(missionDescriptor, "DetermineCompleted")\nLuaUserData.MakeFieldAccessible(missionDescriptor, "completeCheckDataAction")\n', '')
          s = s.replace('local lobbySummaryPending = nil\n\ngm.Name = "Secret"\n', 'local lobbySummaryPending = nil\nlocal missionDescriptors = {}\n\ngm.Name = "Secret"\n')
          old = '''local function missionWouldComplete(mission)\n    if mission == nil or mission.ForceFailure then return false end\n    if mission.Completed then return true end\n    if not mission.DetermineCompleted(transitionTypes.None) then return false end\n\n    local completeCheck = mission.completeCheckDataAction\n    return completeCheck == nil or completeCheck.GetSuccess()\nend\n'''
          new = '''local function missionWouldComplete(mission)\n    if mission == nil or mission.ForceFailure then return false end\n    if mission.Completed then return true end\n\n    local typeName = LuaUserData.TypeOf(mission)\n    if not missionDescriptors[typeName] then\n        local descriptor = Descriptors[typeName] or LuaUserData.RegisterType(typeName)\n        LuaUserData.MakeMethodAccessible(descriptor, "DetermineCompleted", {"Barotrauma.CampaignMode+TransitionType"})\n        LuaUserData.MakeFieldAccessible(descriptor, "completeCheckDataAction")\n        missionDescriptors[typeName] = true\n    end\n\n    if not mission.DetermineCompleted(transitionTypes.None) then return false end\n\n    local completeCheck = mission.completeCheckDataAction\n    return completeCheck == nil or completeCheck.GetSuccess()\nend\n'''
          if old not in s: raise SystemExit('missionWouldComplete block not found')
          s = s.replace(old, new)
          s = s.replace('    if self.FinalSummary ~= nil then return self.FinalSummary end\n    if not self.ResultsFinalized then self:FinalizeResults() end\n\n', '    if self.FinalSummary ~= nil then return self.FinalSummary end\n\n')
          s = s.replace('''        local objectivesCompleted = 0\n        for _, objective in ipairs(role.Objectives or {}) do\n            if not objective.Failed then objectivesCompleted = objectivesCompleted + 1 end\n        end\n''', '''        local objectivesCompleted = 0\n        for _, objective in ipairs(role.Objectives or {}) do\n            if objective.Awarded then objectivesCompleted = objectivesCompleted + 1 end\n        end\n''')
          s = s.replace('''            if objective.Failed then\n                objectiveState = Traitormod.Language.Failed\n            else\n                objectiveState = Traitormod.Language.Completed .. string.format(Traitormod.Language.Points, objective.AmountPoints or 0)\n            end\n            sb(" > %s %s\\n", objective.Text, string.gsub(objectiveState, "^%s+", ""))\n''', '''            if objective.Failed then\n                objectiveState = Traitormod.Language.Failed\n            elseif objective.Awarded then\n                objectiveState = Traitormod.Language.Completed .. string.format(Traitormod.Language.Points, objective.AmountPoints or 0)\n            else\n                objectiveState = ""\n            end\n            sb(" > %s %s\\n", objective.Text, string.gsub(objectiveState, "^%s+", ""))\n''')
          p.write_text(s)
          PY
          test "$(git hash-object "$FILE")" = 'b4865e5b23f22a43a27a01643f08854b0e751548'
          git diff --check
          git config user.name 'kotofey51'
          git config user.email '38777263+sashagavrilyuk@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Fix Secret mission completion access and roundinfo'
          git push origin HEAD:Ai-temp
