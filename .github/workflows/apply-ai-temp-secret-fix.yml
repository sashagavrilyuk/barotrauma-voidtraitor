name: Apply Ai-temp Secret fix

on:
  push:
    branches:
      - Ai-temp
    paths:
      - .github/workflows/apply-ai-temp-secret-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Ai-temp
          fetch-depth: 0
      - name: Use verified transformed Secret SHA for staging
        run: sed -i 's/3149c43fae50b566d5d8dcbb1d18e24571b7e8fc/d24f5970d4455017f2fde384733a7eed74480064/' .github/apply-ai-temp-secret-fix.py
      - name: Apply verified transformations
        run: python3 .github/apply-ai-temp-secret-fix.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "kotofey51"
          git config user.email "38777263+sashagavrilyuk@users.noreply.github.com"
          git add traitormod-voidtraitor-dev-ai/Lua/config/baseconfig.lua \
                  traitormod-voidtraitor-dev-ai/Lua/language/english.lua \
                  traitormod-voidtraitor-dev-ai/Lua/language/russian.lua \
                  traitormod-voidtraitor-dev-ai/Lua/traitormodutil.lua \
                  traitormod-voidtraitor-dev-ai/Lua/pointshop.lua \
                  traitormod-voidtraitor-dev-ai/Lua/traitormod.lua \
                  traitormod-voidtraitor-dev-ai/Lua/ghostroles.lua \
                  traitormod-voidtraitor-dev-ai/Lua/gamemodes/secret.lua
          git commit -m "Fix Secret soft-end architecture"
          git push origin HEAD:Ai-temp
