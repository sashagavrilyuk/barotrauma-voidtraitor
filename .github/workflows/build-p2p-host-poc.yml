name: Build P2P Host PoC

on:
  workflow_dispatch:
  push:
    branches:
      - Ai
    paths:
      - P2PHostPoC/**
      - .github/workflows/build-p2p-host-poc.yml
  pull_request:
    branches:
      - Ai
    paths:
      - P2PHostPoC/**
      - .github/workflows/build-p2p-host-poc.yml

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VoidTraitor repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          path: project

      - name: Checkout LuaCsForBarotrauma 1.13.4.0
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          repository: evilfactory/LuaCsForBarotrauma
          ref: 85ded59c4efed4d139159c4cb056cc9705a5096e
          submodules: recursive
          path: luacs

      - name: Apply automatic P2P host patch
        working-directory: luacs
        run: |
          git apply --check ../project/P2PHostPoC/autop2phost.patch
          git apply ../project/P2PHostPoC/autop2phost.patch
          git diff --check

      - name: Setup .NET 8
        uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee
        with:
          dotnet-version: 8.0.x

      - name: Build Windows LuaCs dedicated server
        working-directory: luacs
        run: >-
          dotnet publish Barotrauma/BarotraumaServer/WindowsServer.csproj
          -c Release
          --self-contained
          -r win-x64
          /p:Platform=x64
          /p:ErrorOnDuplicatePublishOutputFiles=false
          /p:RollForward=Disable
          /p:RuntimeFrameworkVersion=8.0.0
          -o ../p2p-build

      - name: Build Windows LuaCs P2P host client
        working-directory: luacs
        run: >-
          dotnet publish Barotrauma/BarotraumaClient/WindowsClient.csproj
          -c Release
          --self-contained
          -r win-x64
          /p:Platform=x64
          /p:ErrorOnDuplicatePublishOutputFiles=false
          /p:RollForward=Disable
          /p:RuntimeFrameworkVersion=8.0.0
          -o ../p2p-build

      - name: Verify PoC output
        run: |
          test -f p2p-build/Barotrauma.exe
          test -f p2p-build/Barotrauma.dll
          test -f p2p-build/DedicatedServer.exe
          test -f p2p-build/DedicatedServer.dll

      - name: Upload Windows PoC
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: Barotrauma-P2P-Host-PoC-Windows-x64
          path: p2p-build
          if-no-files-found: error
